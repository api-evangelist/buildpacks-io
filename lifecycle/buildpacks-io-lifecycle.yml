versioning:
  scheme: >-
    Independent <major>.<minor> API versions per specification document, negotiated at build time
    between buildpack, lifecycle and platform. Implementations (pack, lifecycle) version separately
    with semver.
  current:
    buildpack_api: '0.12'
    platform_api: '0.15'
    distribution_api: '0.3'
  rule: >-
    "When <major> is greater than 0 increments to <minor> SHALL exclusively indicate additive
    changes" — buildpack.md, Buildpack API Version.
  negotiation: >-
    The lifecycle MUST return an error to the platform if it does not support the buildpack API
    version a buildpack declares in buildpack.toml. Version mismatch fails the build rather than
    silently degrading.
  source: https://github.com/buildpacks/spec/blob/main/buildpack.md
deprecation_policy:
  published: true
  mechanism: >-
    Each specification document carries a dedicated "Deprecations" section naming every deprecated
    feature, the API version it was deprecated in, and the upgrade path.
  url: https://github.com/buildpacks/spec/blob/main/buildpack.md#deprecations
  headers:
    sunset: false
    deprecation: false
    note: RFC 8594 Sunset/Deprecation headers do not apply — the deprecation surface is a build-time contract, not an HTTP API.
  deprecated:
  - feature: buildpack.toml `stacks` array
    deprecated_in: Buildpack API 0.10
    replacement: '`targets` (os/arch/distros)'
  - feature: positional arguments to `bin/detect` and `bin/build`
    deprecated_in: Buildpack API 0.8
  - feature: '`bom` array in launch.toml / build.toml'
    deprecated_in: Buildpack API 0.7
    replacement: per-layer SBOM files (CycloneDX / SPDX / Syft)
  - feature: '`io.buildpacks.stack.*` OCI labels and CNB_STACK_ID'
    deprecated_in: Platform API 0.12
    replacement: run-image metadata and targets
  - feature: '`stack` key in io.buildpacks.lifecycle.metadata'
    deprecated_in: Platform API 0.12
    replacement: top-level `runImage` key
  - feature: '`-image` flag on the exporter'
    deprecated_in: Platform API (see platform.md deprecations)
    replacement: '`-run-image`'

note: >-
  Cloud Native Buildpacks is a specification project, so its "SDKs" are the libraries that let
  an author WRITE a buildpack (libcnb in Go and Rust) and the reference tools that RUN the
  lifecycle (pack, lifecycle). None of them is a client of the registry HTTP API — the only
  first-party consumer of registry.buildpacks.io is the pack CLI itself.

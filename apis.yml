    type: Documentation
  - url: json-schema/buildpacks-project-toml-schema.json
    type: JSONSchema
  description: >-
    The Project Descriptor extension defines project.toml — the optional app-root file letting developers
    declare their builder image, include/exclude globs, buildpack overrides (pre/group/post), and build-time
    env vars. Read by `pack build` and other platforms before invoking the lifecycle.
- aid: buildpacks-io:service-bindings-spec
  name: Service Bindings Extension
  tags:
  - Cloud Native Buildpacks
  - Service Bindings
  - Kubernetes
  humanURL: https://github.com/buildpacks/spec/blob/main/extensions/bindings.md
  properties:
  - url: https://github.com/buildpacks/spec/blob/main/extensions/bindings.md
    type: Documentation
  description: >-
    The Service Bindings extension specifies how external service credentials and configuration are surfaced
    to detect and build under $CNB_PLATFORM_DIR/bindings/. Aligns with the Service Binding Specification
    for Kubernetes and lets buildpacks discover databases, message brokers, and CA bundles without provider
    coupling.

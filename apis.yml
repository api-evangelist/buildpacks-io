  - url: https://github.com/buildpacks/spec
    type: Repository
  description: >-
    The Distribution API (currently 0.3) defines how buildpacks, extensions, and builders are packaged
    as OCI artifacts and published to OCI registries. Covers labels (io.buildpacks.buildpack.api, io.buildpacks.buildpack.layers),
    multi-buildpack OCI artifacts, and image extension distribution.
- aid: buildpacks-io:image-extension-spec
  name: Image Extension Specification
  tags:
  - Cloud Native Buildpacks
  - Image Extension
  - Dockerfile
  - Specification
  humanURL: https://github.com/buildpacks/spec/blob/main/image_extension.md
  properties:
  - url: https://github.com/buildpacks/spec/blob/main/image_extension.md
    type: Documentation
  - url: https://github.com/buildpacks/spec
    type: Repository
  description: >-
    Image extensions emit Dockerfile snippets applied by the `extender` lifecycle binary to the build
    and/or run image. Share the buildpack surface (extension.toml, bin/detect, bin/generate) but produce
    Dockerfile output instead of layers — enabling base-image customization (apt packages, native libs)
    inside a buildpacks workflow.
- aid: buildpacks-io:project-descriptor-spec
  name: Project Descriptor (project.toml)
  tags:
  - Cloud Native Buildpacks
  - Project Descriptor
  - App Surface
  humanURL: https://github.com/buildpacks/spec/blob/main/extensions/project-descriptor.md

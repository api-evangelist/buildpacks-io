  description: >-
    The Buildpack API (currently 0.12) defines the contract between an individual buildpack and the lifecycle.
    It specifies the on-disk layout of a buildpack (buildpack.toml, bin/detect, bin/build), the build
    plan provides/requires graph, layer types (launch/build/cache), launch.toml and build.toml outputs,
    target declarations (os/arch/distros), SBOM emission, and the CNB_* environment variable contract.
- aid: buildpacks-io:platform-spec
  name: Platform Specification
  tags:
  - Cloud Native Buildpacks
  - Platform API
  - Specification
  - CNCF
  humanURL: https://github.com/buildpacks/spec/blob/main/platform.md
  properties:
  - url: https://github.com/buildpacks/spec/blob/main/platform.md
    type: Documentation
  - url: https://github.com/buildpacks/spec
    type: Repository
  - url: json-structure/buildpacks-io-structure.json
    type: JSONStructure
  description: >-
    The Platform API (currently 0.15) defines how platforms (pack, kpack, Tekton Pipelines, GitLab Auto
    DevOps, CircleCI Orb, Project Piper) orchestrate the lifecycle. Specifies the lifecycle binary surface
    (analyzer, detector, restorer, extender, builder, exporter, creator, rebaser, launcher), the TOML
    files exchanged on disk (group.toml, plan.toml, order.toml, run.toml, metadata.toml, report.toml,
    analyzed.toml, project-metadata.toml), the standard io.buildpacks.* OCI image labels, and runtime
    process selection.
- aid: buildpacks-io:distribution-spec
  name: Distribution Specification
  tags:
  - Cloud Native Buildpacks
  - Distribution
  - OCI
  - CNCF
  humanURL: https://github.com/buildpacks/spec/blob/main/distribution.md
  properties:
